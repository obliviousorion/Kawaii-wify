name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-go-binaries:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: kawaii-wify-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: kawaii-wify-linux-arm64
          - goos: windows
            goarch: amd64
            output_name: kawaii-wify-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            output_name: kawaii-wify-darwin-amd64
          - goos: darwin
            goarch: arm64
            output_name: kawaii-wify-darwin-arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/${{ matrix.output_name }} ./cmd/kawaii-wify

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}

  build-android-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Signed Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          elif [ ! -f app/release.jks ]; then
            keytool -genkeypair -v -keystore app/release.jks -alias kawaiiwify -keyalg RSA -keysize 2048 -validity 10000 -storepass kawaiiwify -keypass kawaiiwify -dname "CN=KawaiiWify, OU=Dev, O=KawaiiWify, L=Pilani, ST=RJ, C=IN"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease
          ANDROID_VER=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/kawaii-wify-android-v${ANDROID_VER}.apk"
          cp app/build/outputs/apk/release/app-release.apk ../dist/kawaii-wify-android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/kawaii-wify-android*.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-go-binaries, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate Cross-Platform versions.json Manifest
        run: |
          ANDROID_VER=$(grep -E 'versionName\s*=\s*' android/app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          DESKTOP_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          APK_NAME="kawaii-wify-android-v${ANDROID_VER}.apk"
          cat <<EOF > dist/versions.json
          {
            "desktop": "${DESKTOP_VER}",
            "android": "${ANDROID_VER}",
            "published_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "android_apk_name": "${APK_NAME}",
            "release_url": "https://github.com/obliviousorion/Kawaii-wify/releases/tag/${{ github.ref_name }}"
          }
          EOF
          echo "Generated versions.json:"
          cat dist/versions.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
